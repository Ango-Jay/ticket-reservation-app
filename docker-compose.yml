services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-reservation-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_reservation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticket_reservation}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
